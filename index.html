<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Class Chat</title>
    <style>
        body { font-family: sans-serif; background-color: #dfd3c3; display: flex; justify-content: center; padding: 20px; margin: 0; }
        #chat-card { width: 100%; max-width: 500px; height: 90vh; background: white; display: flex; flex-direction: column; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); overflow: hidden; }
        header { background: #075e54; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; background: #e5ddd5; display: flex; flex-direction: column; gap: 10px; }
        
        /* FIX: No more going out of bounds */
        .msg { 
            background: white; padding: 10px; border-radius: 10px; 
            max-width: 85%; align-self: flex-start; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            word-wrap: break-word; /* Older browsers */
            overflow-wrap: break-word; /* Modern browsers */
            white-space: pre-wrap; 
        }
        
        .msg b { color: #128c7e; font-size: 0.8rem; display: block; margin-bottom: 5px; }
        .del-btn { color: #ff5e5e; cursor: pointer; float: right; font-size: 1.2rem; line-height: 1; }
        
        img, video { max-width: 100%; border-radius: 5px; margin-top: 10px; display: block; }
        audio { width: 100%; margin-top: 10px; }

        .input-area { padding: 15px; background: #f0f0f0; display: flex; flex-direction: column; gap: 10px; }
        .controls { display: flex; gap: 5px; align-items: center; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        
        .icon-btn { background: #ddd; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 1.2rem; }
        #sendBtn { background: #25d366; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #recordBtn.recording { background: #ff5e5e; color: white; animation: blink 1s infinite; }
        
        @keyframes blink { 50% { opacity: 0.5; } }
        #fileInput { display: none; }
    </style>
</head>
<body>

    <div id="chat-card">
        <header>
            <span>Pro Chat v3</span>
            <button onclick="if(confirm('Clear all?')) firebase.database().ref('chats').remove();" style="background:none; border:1px solid white; color:white; cursor:pointer;">Clear</button>
        </header>
        <div id="messages"></div>
        
        <div class="input-area">
            <input type="text" id="username" placeholder="Your Name" style="width: 100px;">
            <div class="controls">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📁</button>
                <button class="icon-btn" id="recordBtn">🎤</button>
                <input type="file" id="fileInput" accept="image/*,video/*,audio/*">
            </div>
            <button id="sendBtn">SEND</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
                const firebaseConfig = {
    apiKey: "AIzaSyChr_GE15lWWlcgTfqPKVfQTbKkhQjxkM4",
    authDomain: "classchat-11a6a.firebaseapp.com",
  // THIS LINE BELOW IS THE MOST IMPORTANT ONE:
    databaseURL: "https://classchat-11a6a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "classchat-11a6a",
    storageBucket: "classchat-11a6a.firebasestorage.app",
    messagingSenderId: "888000836038",
    appId: "1:888000836038:web:871885f36d337f1cd282c7",
    measurementId: "G-RY8WWRMW4N"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const messagesDiv = document.getElementById('messages');
        const recordBtn = document.getElementById('recordBtn');
        let mediaRecorder;
        let audioChunks = [];

        // --- SEND TEXT ---
        function send(data) {
            const name = document.getElementById('username').value || "Guest";
            db.ref("chats").push().set({ username: name, ...data });
        }

        document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('messageInput');
            if(input.value) { send({ text: input.value }); input.value = ""; }
        };

        // --- UPLOAD FILES (Images/Videos) ---
        document.getElementById('fileInput').onchange = function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const type = file.type.split('/')[0]; // image, video, or audio
                send({ [type]: event.target.result });
            };
            reader.readAsDataURL(file);
        };

        // --- RECORD AUDIO ---
        recordBtn.onclick = async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording');
                return;
            }
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.start();
            recordBtn.classList.add('recording');
            
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                const reader = new FileReader();
                reader.onload = e => send({ audio: e.target.result });
                reader.readAsDataURL(audioBlob);
                audioChunks = [];
            };
        };

        // --- DISPLAY MESSAGES ---
        db.ref("chats").on("child_added", (snapshot) => {
            const data = snapshot.val();
            const id = snapshot.key;
            const msg = document.createElement('div');
            msg.className = "msg";
            
            let content = `<span class="del-btn" onclick="firebase.database().ref('chats/${id}').remove(); location.reload();">×</span>`;
            content += `<b>${data.username}</b>`;
            
            if(data.text) content += `<span>${data.text}</span>`;
            if(data.image) content += `<img src="${data.image}">`;
            if(data.video) content += `<video controls src="${data.video}"></video>`;
            if(data.audio) content += `<audio controls src="${data.audio}"></audio>`;

            msg.innerHTML = content;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        // Auto-refresh on delete
        db.ref("chats").on("child_removed", () => location.reload());
    </script>
</body>
</html>
